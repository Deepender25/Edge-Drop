<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Matte Shadow for the Image Motif -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#6B4F3B" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Folder Base Soft Shadow -->
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#8C6A4F" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#folderShadow)">
    <!-- 1. Folder Back Plate & Tab -->
    <path d="M 56 378
             L 56 128
             C 56 112 68 100 84 100
             L 162 100
             C 178 100 190 108 200 120
             C 208 130 218 136 232 136
             L 428 136
             C 444 136 456 148 456 164
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#DFCEBC"/>

    <!-- 2. Paper Sheet Peeking Inside -->
    <path d="M 74 162
             L 74 152
             C 74 147 78 143 83 143
             L 429 143
             C 434 143 438 147 438 152
             L 438 162 Z"
          fill="#FFFDF9"/>

    <!-- 3. Folder Front Flap -->
    <path d="M 56 168
             C 56 156 65 148 76 148
             L 436 148
             C 447 148 456 156 456 168
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#BA9B7B"/>

    <!-- 4. Clean Seamless Photo Frame Motif (Zero Artifacts) -->
    <g filter="url(#glyphShadow)">
      <!-- Sun -->
      <circle cx="272" cy="260" r="14" fill="#FFFFFF"/>

      <!-- Solid Dual-Mountain Silhouette (Seamlessly Merged) -->
      <path d="M 178 346
               L 178 326
               L 230 274
               L 266 308
               L 298 282
               L 334 324
               L 334 346
               Z"
            fill="#FFFFFF"/>

      <!-- Outer Rounded Picture Frame -->
      <rect x="176" y="228" width="160" height="122" rx="18"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="12"/>
    </g>
  </g>
</svg>