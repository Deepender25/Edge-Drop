<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Matte Shadow for the Spreadsheet Card -->
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>

    <!-- Folder Base Soft Shadow -->
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <g filter="url(#folderShadow)">
    <!-- 1. Folder Back Plate & Tab -->
    <path d="M 56 378
             L 56 128
             C 56 112 68 100 84 100
             L 162 100
             C 178 100 190 108 200 120
             C 208 130 218 136 232 136
             L 428 136
             C 444 136 456 148 456 164
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#7EE6BC"/>

    <!-- 2. Paper Sheet Peeking Inside -->
    <path d="M 74 162
             L 74 152
             C 74 147 78 143 83 143
             L 429 143
             C 434 143 438 147 438 152
             L 438 162 Z"
          fill="#F0FDF8"/>

    <!-- 3. Folder Front Flap -->
    <path d="M 56 168
             C 56 156 65 148 76 148
             L 436 148
             C 447 148 456 156 456 168
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#52D7A4"/>

    <!-- 4. Folded Spreadsheet Document Sheet Motif -->
    <g filter="url(#sheetShadow)">
      <!-- Main Paper Sheet with Corner Cut -->
      <path d="M 204 200
               C 195 200 188 207 188 216
               L 188 364
               C 188 373 195 380 204 380
               L 308 380
               C 317 380 324 373 324 364
               L 324 244
               C 324 240 322 236 319 233
               L 291 205
               C 288 202 284 200 280 200
               Z"
            fill="#F0FDF8"/>

      <!-- Folded Corner L-Flap -->
      <path d="M 281 201
               L 281 232
               C 281 238 286 243 292 243
               L 323 243"
            fill="none"
            stroke="#52D7A4"
            stroke-width="7"
            stroke-linecap="round"
            stroke-linejoin="round"/>

      <!-- Spreadsheet Outer Table Frame (Moved Up & Balanced) -->
      <rect x="210" y="262" width="92" height="86" rx="8"
            fill="none"
            stroke="#52D7A4"
            stroke-width="5"/>

      <!-- Horizontal Table Divider 1 (Header Row) -->
      <line x1="210" y1="290" x2="302" y2="290"
            stroke="#52D7A4"
            stroke-width="5"/>

      <!-- Horizontal Table Divider 2 -->
      <line x1="210" y1="319" x2="302" y2="319"
            stroke="#52D7A4"
            stroke-width="5"/>

      <!-- Vertical Column Divider 1 -->
      <line x1="241" y1="262" x2="241" y2="348"
            stroke="#52D7A4"
            stroke-width="5"/>

      <!-- Vertical Column Divider 2 -->
      <line x1="271" y1="262" x2="271" y2="348"
            stroke="#52D7A4"
            stroke-width="5"/>
    </g>
  </g>
</svg>