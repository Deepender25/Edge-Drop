<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Matte Shadow for the CPU Chip Motif -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3730A3" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.05"/>
    </filter>

    <!-- Folder Base Soft Shadow -->
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4338CA" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#folderShadow)">
    <!-- 1. Folder Back Plate & Tab -->
    <path d="M 56 378
             L 56 128
             C 56 112 68 100 84 100
             L 162 100
             C 178 100 190 108 200 120
             C 208 130 218 136 232 136
             L 428 136
             C 444 136 456 148 456 164
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#C7D2FE"/>

    <!-- 2. Paper Sheet Peeking Inside -->
    <path d="M 74 162
             L 74 152
             C 74 147 78 143 83 143
             L 429 143
             C 434 143 438 147 438 152
             L 438 162 Z"
          fill="#F5F7FF"/>

    <!-- 3. Folder Front Flap -->
    <path d="M 56 168
             C 56 156 65 148 76 148
             L 436 148
             C 447 148 456 156 456 168
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#93A4FC"/>

    <!-- 4. Minimalist Silicon Processor Chip Motif -->
    <g filter="url(#glyphShadow)">
      <!-- Connection Pins (3 on each of the 4 sides) -->
      <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
        <!-- Top Pins -->
        <line x1="226" y1="235" x2="226" y2="218"/>
        <line x1="256" y1="235" x2="256" y2="218"/>
        <line x1="286" y1="235" x2="286" y2="218"/>

        <!-- Bottom Pins -->
        <line x1="226" y1="343" x2="226" y2="360"/>
        <line x1="256" y1="343" x2="256" y2="360"/>
        <line x1="286" y1="343" x2="286" y2="360"/>

        <!-- Left Pins -->
        <line x1="202" y1="259" x2="185" y2="259"/>
        <line x1="202" y1="289" x2="185" y2="289"/>
        <line x1="202" y1="319" x2="185" y2="319"/>

        <!-- Right Pins -->
        <line x1="310" y1="259" x2="327" y2="259"/>
        <line x1="310" y1="289" x2="327" y2="289"/>
        <line x1="310" y1="319" x2="327" y2="319"/>
      </g>

      <!-- Main Silicon Chip Die Body -->
      <rect x="202" y="235" width="108" height="108" rx="20" fill="#FFFFFF"/>

      <!-- Clean Central Processor Cavity -->
      <rect x="226" y="259" width="60" height="60" rx="12" fill="#93A4FC"/>
    </g>
  </g>
</svg>