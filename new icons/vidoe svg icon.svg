<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Matte Shadow for the Cinema Film Card -->
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.04"/>
    </filter>

    <!-- Folder Base Soft Shadow -->
    <filter id="folderShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.14"/>
    </filter>
  </defs>

  <g filter="url(#folderShadow)">
    <!-- 1. Folder Back Plate & Tab -->
    <path d="M 56 378
             L 56 128
             C 56 112 68 100 84 100
             L 162 100
             C 178 100 190 108 200 120
             C 208 130 218 136 232 136
             L 428 136
             C 444 136 456 148 456 164
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#94A3B8"/>

    <!-- 2. Paper Sheet Peeking Inside -->
    <path d="M 74 162
             L 74 152
             C 74 147 78 143 83 143
             L 429 143
             C 434 143 438 147 438 152
             L 438 162 Z"
          fill="#F8FAFC"/>

    <!-- 3. Folder Front Flap -->
    <path d="M 56 168
             C 56 156 65 148 76 148
             L 436 148
             C 447 148 456 156 456 168
             L 456 378
             C 456 396 442 410 424 410
             L 88 410
             C 70 410 56 396 56 378 Z"
          fill="#64748B"/>

    <!-- 4. Cinema Film Strip Motif -->
    <g filter="url(#sheetShadow)">
      <!-- Main White Film Strip Card -->
      <rect x="176" y="224" width="160" height="128" rx="20" fill="#F8FAFC"/>

      <!-- Left Sprocket Holes -->
      <rect x="192" y="240" width="16" height="16" rx="4" fill="#64748B"/>
      <rect x="192" y="266.67" width="16" height="16" rx="4" fill="#64748B"/>
      <rect x="192" y="293.33" width="16" height="16" rx="4" fill="#64748B"/>
      <rect x="192" y="320" width="16" height="16" rx="4" fill="#64748B"/>

      <!-- Center Film Frame Window (x=216 to 296, Center=256) -->
      <rect x="216" y="240" width="80" height="96" rx="8" fill="#64748B"/>

      <!-- Right Sprocket Holes -->
      <rect x="304" y="240" width="16" height="16" rx="4" fill="#64748B"/>
      <rect x="304" y="266.67" width="16" height="16" rx="4" fill="#64748B"/>
      <rect x="304" y="293.33" width="16" height="16" rx="4" fill="#64748B"/>
      <rect x="304" y="320" width="16" height="16" rx="4" fill="#64748B"/>

      <!-- Mathematically Centered Play Triangle -->
      <path d="M 243 274
               C 243 271 246.5 269 249.5 270.8
               L 269.5 284.8
               C 272.5 286.5 272.5 289.5 269.5 291.2
               L 249.5 305.2
               C 246.5 307 243 305 243 302
               Z"
            fill="#FFFFFF"/>
    </g>
  </g>
</svg>